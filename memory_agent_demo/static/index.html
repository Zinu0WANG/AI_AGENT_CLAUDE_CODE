<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Memory Agent Lab</title>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <div class="shell">
    <header>
      <div>
        <p class="eyebrow">MEMORY AGENT LAB</p>
        <h1>记忆不是聊天记录，<br>而是可检索的认知资产。</h1>
      </div>
      <div class="mode-card">
        <span id="statusDot" class="dot"></span>
        <div>
          <small>运行模式</small>
          <strong id="modeText">正在连接…</strong>
        </div>
      </div>
    </header>

    <main>
      <section class="chat-panel panel">
        <div class="panel-head">
          <div>
            <span class="number">01</span>
            <h2>对话与短期记忆</h2>
          </div>
          <button id="newSessionButton" class="ghost-button">新建会话</button>
        </div>
        <div id="sessionLabel" class="session-label">尚未创建会话</div>
        <div id="messages" class="messages">
          <div class="empty-state">
            <strong>从一次自我介绍开始</strong>
            <span>试试：“我叫小林，我喜欢简洁的中文回答。”</span>
          </div>
        </div>
        <form id="chatForm" class="composer">
          <textarea id="messageInput" rows="2" placeholder="告诉 Agent 一件值得记住的事…" required></textarea>
          <button type="submit" id="sendButton">发送</button>
        </form>
        <details class="summary-card">
          <summary>查看当前会话摘要</summary>
          <p id="summaryText">会话尚未触发压缩。</p>
        </details>
      </section>

      <aside class="memory-panel panel">
        <div class="panel-head">
          <div>
            <span class="number">02</span>
            <h2>长期记忆</h2>
          </div>
          <span id="memoryCount" class="count">0 条</span>
        </div>
        <div class="filters">
          <input id="memorySearch" type="search" placeholder="搜索记忆或测试语义召回">
          <select id="statusFilter">
            <option value="active">活跃记忆</option>
            <option value="archived">已归档</option>
            <option value="deleted">回收站</option>
            <option value="superseded">已被替代</option>
          </select>
        </div>
        <div id="memoryList" class="memory-list"></div>
      </aside>
    </main>

    <section class="recall-panel panel">
      <div class="panel-head">
        <div>
          <span class="number">03</span>
          <h2>本轮召回轨迹</h2>
        </div>
        <span class="caption">分数均已归一化至 0–1</span>
      </div>
      <div id="recallTrace" class="recall-grid">
        <div class="empty-state compact">发送消息后，这里会解释 Agent 为什么想起某条记忆。</div>
      </div>
    </section>
  </div>

  <div id="toast" class="toast"></div>
  <script src="/static/app.js"></script>
</body>
</html>
